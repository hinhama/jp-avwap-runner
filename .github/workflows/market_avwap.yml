
name: JPX AVWAP public runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python market_prepare.py --limit 200 --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: market-shards
          path: market_shards/

  calculate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['00', '01', '02', '03', '04', '05', '06', '07']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-shards
          path: market_shards/
      - name: Fetch TDnet candidates
        env:
          TDNET_TICKERS_FILE: market_shards/tickers_${{ matrix.shard }}.csv
          TDNET_OUTPUT_FILE: market_results/shard_${{ matrix.shard }}/tdnet_auto_candidates.csv
          TDNET_SLEEP: '1'
        run: python tdnet_market.py
      - name: Calculate AVWAP
        env:
          AVWAP_TICKERS_FILE: market_shards/tickers_${{ matrix.shard }}.csv
          AVWAP_OUTPUT_DIR: market_results/shard_${{ matrix.shard }}
          TDNET_CANDIDATES_FILE: market_results/shard_${{ matrix.shard }}/tdnet_auto_candidates.csv
          AVWAP_SLEEP: '1.5'
        run: python avwap_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-result-${{ matrix.shard }}
          path: market_results/shard_${{ matrix.shard }}/

  merge:
    needs: calculate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: market-result-*
          path: downloaded/
      - name: Rebuild shard directories
        run: |
          mkdir -p market_results
          for d in downloaded/market-result-*; do
            [ -d "$d" ] || continue
            id="${d##*-}"
            mkdir -p "market_results/shard_${id}"
            cp -r "$d/." "market_results/shard_${id}/"
          done
      - name: Verify all shards
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          paths = sorted(Path('market_results').glob('shard_*/avwap_latest.csv'))
          assert len(paths) == 8, f'Expected 8 shards, found {len(paths)}'
          codes = []
          for path in paths:
              with path.open(encoding='utf-8-sig', newline='') as f:
                  codes.extend(row['code'] for row in csv.DictReader(f))
          assert len(codes) == 200, f'Expected 200 rows, found {len(codes)}'
          assert len(set(codes)) == 200, 'Duplicate stock codes detected'
          print('Validated 200 unique stocks across 8 shards')
          PY
      - run: python market_merge.py
      - run: python market_quality.py
      - run: python avwap_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: JPX-AVWAP-test-results
          path: market_merged/
