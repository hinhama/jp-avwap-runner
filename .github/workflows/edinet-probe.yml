name: EDINET financial probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: python edinet_probe.py
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: EDINET-probe-results
          path: edinet_probe_results/
